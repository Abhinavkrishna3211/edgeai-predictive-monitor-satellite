te firmware</text><rect x="322.8" y="687" width="16" height="16" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.4"/><text x="346.8" y="700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">This repo's gateway</text><rect x="502.2" y="687" width="16" height="16" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.4"/><text x="526.2" y="700" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start">Validated / dashboard output</text></svg>