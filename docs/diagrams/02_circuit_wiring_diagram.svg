<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820"><rect x="0" y="0" width="1160" height="820" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker></defs><text x="580.0" y="34" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Wiring / Circuit Diagram</text><text x="580.0" y="56" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Seeed XIAO ESP32-S3 satellite -- KX134 accelerometer (SPI) + INMP441 mic (I2S) + WS2812 status ring</text><rect x="430" y="300" width="300" height="220" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="580.0" y="328" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E3A8A" text-anchor="middle">Seeed XIAO ESP32-S3</text><text x="580.0" y="347" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1E3A8A" text-anchor="middle">(satellite MCU)</text><line x1="448" y1="358" x2="712" y2="358" stroke="#93C5FD" stroke-width="1.2"/><text x="580.0" y="382" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="middle">USB-C: 5V in, flashing, serial console</text><text x="580.0" y="398" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="middle">3V3 rail powers all three peripherals</text><text x="580.0" y="414" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="middle">GND is common to MCU + all peripherals</text><text x="580.0" y="430" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="middle">SPI2 dedicated to KX134 (no shared bus)</text><text x="580.0" y="446" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1E3A8A" text-anchor="middle">I2S0 dedicated to the INMP441</text><text x="580.0" y="504" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="600" fill="#3B82F6" text-anchor="middle">components/epm_drivers/</text><rect x="50" y="90" width="320" height="260" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6"/><text x="210.0" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle">KX134-1211 Accelerometer</text><text x="210.0" y="132" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" font-weight="400" fill="#1E3A8A" text-anchor="middle">3-axis, SPI, ADR-017  --  accel_kx134_spi.c</text><line x1="68" y1="144" x2="352" y2="144" stroke="#93C5FD" stroke-width="1"/><text x="72" y