rker-end="url(#arrow-amber)"/><line x1="610.0" y1="630" x2="610.0" y2="520" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4,3"/><rect x="466.784" y="564.7" width="77.21600000000001" height="16.3" rx="4" fill="#FEF3C7" stroke="none" stroke-width="0"/><text x="540.0" y="575.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" font-weight="600" fill="#78350F" text-anchor="end">DIN &lt;- GPIO6</text><rect x="616.0" y="564.7" width="77.21600000000001" height="16.3" rx="4" fill="#F1F5F9" stroke="none" stroke-width="0"/><text x="620.0" y="575.0" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.3" font-weight="600" fill="#334155" text-anchor="start">5V/3V3 + GND</text><text x="60" y="770" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Note:</text><text x="60" y="788" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#64748B" text-anchor="start">GPIO numbers are ESP32-S3 chip pins; XIAO silkscreen names (D1, D6, ...) are shown alongside for board-level wiring.</text></svg>