name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gateway dependencies
        run: pip install -r mic_tools/requirements.txt -r mic_tools/requirements-dev.txt

      - name: Run pytest suite
        run: python -m pytest tests/ -q
